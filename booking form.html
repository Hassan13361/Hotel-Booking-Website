<!DOCTYPE html>
<html>
    <head>
        <title>Booking</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0 ">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="BookF.css">
    </head>
    <body>
        <nav>
            <input type="checkbox" id="check">
            <label for="check"><i class="fas fa-bars" id="checkbtn"></i></label>
            <label for="title" class="logo">Online Hotel Booking</label>
            <ul>
                <li><a href="/homepagehtml.html">Home</a></li>
                <li><a href="/hotels webpage.html">Hotels</a></li>
                <li><a href="/BR webpage.html">Booking-rules</a></li>
                <li><a href="/about us webpage.html">About Us</a></li>
                <li><a href="/contact us webpage.html">Contact Us</a></li>
            </ul>
        </nav>
            <div id="forms"  >
                <!-- Hotel Booking Form -->
                <form action="http://localhost/cwd/" method="post" >
                    <h1>Hotel Booking Details</h1>
                    <label for="hotel">Hotel</label><br>
                    <select name="hotel">
                        <option>Pine view Hotel,IJP Road,Islamabad</option>
                        <option>Reina Botique Hotel,G6,Islamabad</option>
                        <option>Hotel Faran,G10,Islamabad</option>
                        <option>Islamabad Serena Hotel,G5,Islamabad</option>
                        <option>Amin Hotel,Tehkal,Peshawar</option>
                        <option>Shelton Rezidor,Hashtrangi,Peshawar</option>
                        <option>Fort Continual,Shahi Bhagh,Peshawar</option>
                        <option>Hotel Grand,Tehkal,Peshawar</option>
                        <option>Hotel One,Gulberg,Lahore</option>
                        <option>Hilton Suites,Gulberg,Lahore</option>
                        <option>Pearl continetal Hotel,Lahore</option>
                        <option>Rose Palace Hotel,Gulberg,Lahore</option>
                        <option>Hotel Crown,Saddar,Karachi</option>
                        <option>Hotel Mehran, Karachi Cantt</option>
                        <option>Hotel Excelsior,Saddar Town,Karachi</option>
                        <option>Hotel Seaview,Clifton,Karachi</option>
                    </select><br><br>

                    <label for="checkIn">Check-in Date:</label><br>
                    <input type="date"  name="checkIn" required><br><br>

                    <label for="days">Number of days:</label><br>
                    <input type="number"  name="days" min="1" max="20" required><br><br>

                    <label for="rooms">Number of Rooms:</label><br>
                    <input type="number"  name="rooms" min="1" max="10" required><br><br>

                    <label for="guests">Number of Guests:</label><br>
                    <input type="number"  name="guests" min="1" max="20" required><br><br>

                    <h1>Personal Information</h1>
                    <label for="name">Name:</label><br>
                    <input type="text"  name="name" placeholder="Enter your full name" required><br><br>
    
                    <label for="phone">Phone:</label><br>
                    <input type="tel" name="phone" placeholder="Enter your phone number" required><br><br>
    
                    <label for="email">Email:</label><br>
                    <input type="email"  name="email" placeholder="Enter your email address" required><br><br>
    
                    <label for="cnic"> ID Card or Passport Number:</label><br>
                   <input type="text" name="cnic" placeholder="37201-019132-2" ><br><br>
    

                    <h1>Bill payment</h1>

                <label for="card">Card No.:</label><br>
                <input type="number" name="card"  min="1" placeholder="0000 0000 0000 0000" required><br><br>

                <label for="expdate">Expiry Date:</label><br>
                <input type="date" name="expdate"  placeholder="Enter card Expiry"><br><br>

                <label for="code">PIN:</label><br>
                <input type="password" name="code" placeholder="Enter PIN" required><br><br>

                    <input type="submit" name="save" id="button">
                </form>
        </div>
    </body>
</html>
